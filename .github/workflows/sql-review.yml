name: SQL Review
on:
  pull_request:
    branches: ["main"]
    paths: ["migrations/*.sql"]
jobs:
  sql-review:
    permissions:
      id-token: write
      pull-requests: write
    runs-on: [self-hosted, macOS]
    env:
      BYTEBASE_URL: http://localhost:8080
      BYTEBASE_WORKLOAD_IDENTITY: abcdefg@aowuaowu.workload.bytebase.com
    steps:
      - uses: actions/checkout@v4
      - name: Exchange token
        id: bytebase-auth
        run: |
          echo "=== Step 1: Get OIDC token ==="
          OIDC_RESPONSE=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=bytebase")
          echo "OIDC response length: $(echo "$OIDC_RESPONSE" | wc -c)"
          OIDC_TOKEN=$(echo "$OIDC_RESPONSE" | jq -r '.value')
          echo "OIDC token length: ${#OIDC_TOKEN}"

          echo "=== Step 2: Exchange token ==="
          EXCHANGE_RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST "$BYTEBASE_URL/v1/auth:exchangeToken" \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"$OIDC_TOKEN\",\"email\":\"$BYTEBASE_WORKLOAD_IDENTITY\"}")
          echo "Exchange response: $EXCHANGE_RESPONSE"

          ACCESS_TOKEN=$(echo "$EXCHANGE_RESPONSE" | grep -v HTTP_CODE | jq -r '.accessToken // empty')
          echo "Access token length: ${#ACCESS_TOKEN}"
          echo "access-token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT
      - name: SQL Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ~/bin/bytebase-action check \
            --url=$BYTEBASE_URL \
            --access-token=${{ steps.bytebase-auth.outputs.access-token }} \
            --project=projects/aowuaowu \
            --targets=instances/pg-docker/databases/db01 \
            --file-pattern=migrations/*.sql
