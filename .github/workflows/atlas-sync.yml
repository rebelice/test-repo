name: Atlas Migrate Push
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'migrations/**'

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ariga/setup-atlas@v0
        with:
          cloud-token: ${{ secrets.ATLAS_TOKEN }}
      - name: Generate migration checksum
        run: atlas migrate hash --env ci
      - name: Push migrations to Atlas Cloud
        run: atlas migrate push test-repo-v2 --env ci
