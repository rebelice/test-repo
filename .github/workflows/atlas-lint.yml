name: Atlas Migrate Lint
on:
  pull_request:
    paths:
      - 'migrations/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ariga/setup-atlas@v0
        with:
          cloud-token: ${{ secrets.ATLAS_TOKEN }}
      - name: Generate migration checksum
        run: atlas migrate hash --dir "file://migrations"
      - name: Run Atlas Migrate Lint
        run: |
          atlas migrate lint \
            --dir "file://migrations" \
            --dir-name "test-repo-v3" \
            --dev-url "docker://postgres/16/dev?search_path=public" \
            --git-base "origin/main" \
            --web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
