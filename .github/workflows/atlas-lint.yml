name: Atlas Migrate Lint
on:
  pull_request:
    paths:
      - 'migrations/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ariga/setup-atlas@v0
      - name: Run Atlas Migrate Lint
        run: |
          atlas migrate lint \
            --dev-url "docker://postgres/16/dev?search_path=public" \
            --dir "file://migrations" \
            --git-base "origin/main" \
            --format '{{ range .Steps }}{{ range .Reports }}{{ range .Diagnostics }}{{ .Text }}{{ "\n" }}{{ end }}{{ end }}{{ end }}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
