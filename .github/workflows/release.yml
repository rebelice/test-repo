name: Rollout
on:
  push:
    branches: ["main"]
    paths: ["migrations/*.sql"]
  workflow_dispatch:
env:
  BYTEBASE_URL: https://cloud.bytebase.com
  BYTEBASE_WORKLOAD_IDENTITY: github@gitops-dvmo.workload.bytebase.com
  BYTEBASE_PROJECT: projects/gitops-dvmo
  BYTEBASE_TARGETS: projects/gitops-dvmo/instances/supabase-ji8m/databases/postgres
jobs:
  rollout:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    container:
      image: bytebase/bytebase-action:cloud
    steps:
      - uses: actions/checkout@v4
      - name: Exchange token
        id: bytebase-auth
        run: |
          OIDC_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=bytebase" | jq -r '.value')
          ACCESS_TOKEN=$(curl -s -X POST "$BYTEBASE_URL/v1/auth:exchangeToken" \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"$OIDC_TOKEN\",\"email\":\"$BYTEBASE_WORKLOAD_IDENTITY\"}" \
            | jq -r '.accessToken')
          echo "::add-mask::$ACCESS_TOKEN"
          echo "access-token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT
      - name: Create release, plan and rollout
        id: create
        run: |
          bytebase-action rollout \
            --url=$BYTEBASE_URL \
            --access-token=${{ steps.bytebase-auth.outputs.access-token }} \
            --project=$BYTEBASE_PROJECT \
            --targets=$BYTEBASE_TARGETS \
            --file-pattern=migrations/*.sql \
            --output=$RUNNER_TEMP/bytebase-metadata.json
          echo "--- created resources ---"
          cat $RUNNER_TEMP/bytebase-metadata.json
          echo "plan=$(jq -r .plan $RUNNER_TEMP/bytebase-metadata.json)" >> $GITHUB_OUTPUT
          echo "rollout=$(jq -r .rollout $RUNNER_TEMP/bytebase-metadata.json)" >> $GITHUB_OUTPUT
      # The workload identity cannot read environments, so take the stage from the rollout itself.
      - name: Discover rollout stage
        id: stage
        env:
          TOKEN: ${{ steps.bytebase-auth.outputs.access-token }}
        run: |
          ROLLOUT_JSON=$(curl -s -H "Authorization: Bearer $TOKEN" "$BYTEBASE_URL/v1/${{ steps.create.outputs.rollout }}")
          echo "$ROLLOUT_JSON" | jq '{name, stages: [.stages[] | {environment, tasks: [.tasks[] | {target, status}]}]}'
          echo "environment=$(echo "$ROLLOUT_JSON" | jq -r '.stages[0].environment')" >> $GITHUB_OUTPUT
      - name: Deploy
        run: |
          bytebase-action rollout \
            --url=$BYTEBASE_URL \
            --access-token=${{ steps.bytebase-auth.outputs.access-token }} \
            --project=$BYTEBASE_PROJECT \
            --plan=${{ steps.create.outputs.plan }} \
            --target-stage=${{ steps.stage.outputs.environment }}
