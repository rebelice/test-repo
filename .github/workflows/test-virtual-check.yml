name: Test Virtual Check (No Database)

on:
  push:
    branches: [main]
    paths:
      - 'migrations/**'
  pull_request:
    paths:
      - 'migrations/**'
  workflow_dispatch:

jobs:
  virtual-check:
    runs-on: self-hosted

    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get OIDC Token
        id: oidc
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r '.value')
          echo "oidc_token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Exchange for Bytebase Token
        id: exchange
        run: |
          RESPONSE=$(curl -s -X POST "http://localhost:8080/v1/auth:exchangeToken" \
            -H "Content-Type: application/json" \
            -d "{
              \"email\": \"github_bot@workload.bytebase.com\",
              \"token\": \"${{ steps.oidc.outputs.oidc_token }}\"
            }")
          ACCESS_TOKEN=$(echo $RESPONSE | jq -r '.accessToken')
          if [ "$ACCESS_TOKEN" == "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "Failed to get access token"
            echo "Response: $RESPONSE"
            exit 1
          fi
          echo "access_token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT
          echo "Successfully obtained Bytebase access token"

      - name: Bytebase Virtual Check
        run: |
          /Users/rebeliceyang/Github/bytebase/bytebase-action check \
            --url http://localhost:8080 \
            --access-token ${{ steps.exchange.outputs.access_token }} \
            --project projects/aowuaowu \
            --engine POSTGRES \
            --file-pattern "migrations/*.sql" \
            --check-release FAIL_ON_ERROR \
            --output results.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show Results
        if: always()
        run: |
          echo "=== Virtual Check Results ==="
          cat results.json 2>/dev/null | jq . || echo "No results file"
